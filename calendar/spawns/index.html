		<!--
            Decodes the redirect 404.html issues for a real in-app path (e.g. a
            hard load of /pokemon/pikachu) back into that path via
            history.replaceState, before React Router mounts and reads the URL.
            Must run first, before any other script. See public/404.html.
        -->
		<script type="text/javascript">
			(function (l) {
				if (l.search[1] === '/') {
					var decoded = l.search
						.slice(1)
						.split('&')
						.map(function (s) {
							return s.replace(/~and~/g, '&');
						})
						.join('?');
					window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
				}
			})(window.location);
		</script>
