<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<!-- faithful vector re-creation of .r-logo-ball (src/components.css) -->
	<!-- solid backing fill, same shade as the ball's own outer ring (the
	     accent color, #58a7ff) — iOS renders a transparent apple-touch-icon
	     as plain black on the home screen instead of leaving it see-through,
	     so the PNGs rasterized from this file (logo192.png / logo512.png)
	     need an opaque background; the OS applies its own rounded-square
	     mask on top. -->
	<rect x="0" y="0" width="512" height="512" fill="#58a7ff" />
	<circle cx="256" cy="256" r="224" fill="none" stroke="#58a7ff" stroke-width="32" />
	<path d="M 48 256 A 208 208 0 0 1 464 256 Z" fill="#ff5b5b" />
	<path d="M 48 256 A 208 208 0 0 0 464 256 Z" fill="#f4f4f5" />
	<circle cx="256" cy="256" r="189" fill="none" stroke="#11151c" stroke-width="38" />
	<circle cx="256" cy="256" r="104" fill="#f4f4f5" />
	<circle cx="256" cy="256" r="66" fill="#11151c" />
</svg>
