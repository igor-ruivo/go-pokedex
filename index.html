<!doctype html>
<html lang="en">
	<head>
		<!--
            Decodes the redirect 404.html issues for a real in-app path (e.g. a
            hard load of /pokemon/pikachu) back into that path via
            history.replaceState, before React Router mounts and reads the URL.
            Must run first, before any other script. See public/404.html.
        -->
		<script type="text/javascript">
			(function (l) {
				if (l.search[1] === '/') {
					var decoded = l.search
						.slice(1)
						.split('&')
						.map(function (s) {
							return s.replace(/~and~/g, '&');
						})
						.join('?');
					window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
				}
			})(window.location);
		</script>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1 maximum-scale=1 user-scalable=no" />
		<meta name="theme-color" content="#0b0e14" />
		<!--
            Makes "Add to Home Screen" on iOS launch fullscreen (no Safari
            address bar/tab chrome) instead of reopening as a normal browser
            tab — iOS ignores manifest.json's `display: standalone` entirely
            without this. `apple-mobile-web-app-capable` is Apple-specific and
            still the only thing Safari actually honours, deprecated warning
            or not — `mobile-web-app-capable` is the standard replacement
            Chrome/Android expects instead, so both stay in, one per platform.
            The service worker (see vite.config.ts) is what makes Chrome
            offer its own native install prompt there.
        -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="GO Pokédex" />
		<meta
			name="description"
			content="A complete Pokémon GO Pokédex where you can search and analyse Pokémon IVs, stats and more."
		/>
		<!--
            Baseline Open Graph/Twitter Card tags — a real, crisp 512x512 image
            instead of leaving link-preview crawlers (WhatsApp, Discord, …) to
            fall back to favicon.ico (32x32, blurry once stretched to a preview
            thumbnail). scripts/prerender.mjs and usePageMeta.ts override these
            per page (a Pokémon/move's own sprite, etc.) — this is just the
            floor so nothing is ever left without a decent one.
        -->
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://go-pokedex.com/logo512.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:image" content="https://go-pokedex.com/logo512.png" />
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-2N9E93LMRT"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());

			gtag('config', 'G-2N9E93LMRT');
		</script>
		<link rel="apple-touch-icon" href="/logo192.png" />
		<!-- app typefaces -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
